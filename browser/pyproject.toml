[project]
name = "radar-browser"
version = "0.1.0"
description = "A headless browser for Radar's fetch ladder: pages drawn by script and JS challenges"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "camoufox>=0.5.6",
    "python-socks[asyncio]>=2.7.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
radar-browser = "radar_browser.app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "radar_browser"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "mypy>=1.20.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "S", "ASYNC", "RUF", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
