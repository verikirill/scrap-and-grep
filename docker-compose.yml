name: radar

# One image, several roles. Everything that holds state is a separate service,
# so the api and the workers can be scaled with --scale without coordination.
x-backend: &backend
  build:
    context: ./backend
  image: radar-backend:local
  restart: unless-stopped
  # The backend needs no privileges and writes nothing but temporary files.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: &backend-env
    RADAR_ENVIRONMENT: production
    RADAR_LOG_LEVEL: ${RADAR_LOG_LEVEL:-INFO}
    RADAR_DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar}@pgbouncer:6432/radar
    RADAR_DB_DISABLE_PREPARED_STATEMENTS: "true"
    RADAR_BROKER_URL: redis://valkey:6379/0
    RADAR_CACHE_URL: redis://valkey:6379/1
    RADAR_OLLAMA_BASE_URL: ${RADAR_OLLAMA_BASE_URL:-http://ollama:11434}
    RADAR_EMBEDDING_PROVIDER: ${RADAR_EMBEDDING_PROVIDER:-hashing}
    RADAR_EMBEDDING_MODEL: ${RADAR_EMBEDDING_MODEL:-embeddinggemma:300m}
    RADAR_LLM_PROVIDER: ${RADAR_LLM_PROVIDER:-heuristic}
    # A local model of the finals in the bundled Ollama, which also pulls it.
    # vLLM and other servers are set by the base URL (see .env.example).
    RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-qwen3.6:35b-a3b}
    RADAR_LLM_BASE_URL: ${RADAR_LLM_BASE_URL:-}
    RADAR_LLM_API_KEY: ${RADAR_LLM_API_KEY:-}
    RADAR_LLM_PROJECT: ${RADAR_LLM_PROJECT:-}
    RADAR_LLM_REASONING: ${RADAR_LLM_REASONING:-off}
    RADAR_LLM_CONCURRENCY: ${RADAR_LLM_CONCURRENCY:-2}
    RADAR_INGEST_CRON: ${RADAR_INGEST_CRON:-*/15 * * * *}
    # Proxies for reading sources: one for every request (the corporate one),
    # or a pool tried when a site refuses the server (see .env.example).
    RADAR_HTTP_PROXY: ${RADAR_HTTP_PROXY:-}
    RADAR_HTTP_PROXIES: ${RADAR_HTTP_PROXIES:-}
    # The headless browser for pages drawn by script and JS challenges, on
    # by default; empty turns the step off. Only the ingest worker reaches
    # it and FlareSolverr (the solver profile: http://flaresolverr:8191);
    # the reader in the api stays on the lighter steps.
    RADAR_BROWSER_URL: ${RADAR_BROWSER_URL-http://browser:8000}
    RADAR_BROWSER_TABS: ${BROWSER_TABS:-2}
    RADAR_FLARESOLVERR_URL: ${RADAR_FLARESOLVERR_URL:-}
    RADAR_FETCH_HOST_INTERVAL_SECONDS: ${RADAR_FETCH_HOST_INTERVAL_SECONDS:-1}
    # NVD answers 50 requests in 30 s with a key, 5 without (see .env.example).
    RADAR_NVD_API_KEY: ${RADAR_NVD_API_KEY:-}
    RADAR_CANDIDATE_LIMIT: ${RADAR_CANDIDATE_LIMIT:-60}
    RADAR_RATE_LIMIT_PER_MINUTE: ${RADAR_RATE_LIMIT_PER_MINUTE:-120}
    RADAR_DIGEST_TASK_TIMEOUT_SECONDS: ${RADAR_DIGEST_TASK_TIMEOUT_SECONDS:-1200}
    # Accounts. The demo sign-in is on by default so that the stack can be
    # looked at without registering; turn it off outside a demonstration.
    RADAR_DEMO_LOGIN: ${RADAR_DEMO_LOGIN:-true}
    # No sign-in screen: a visitor is entered as a guest of their own.
    RADAR_AUTH: ${RADAR_AUTH:-off}
    # Every reader may add a source; its author may change and remove it.
    RADAR_OPEN_CATALOG: ${RADAR_OPEN_CATALOG:-true}
    RADAR_REGISTRATION_OPEN: ${RADAR_REGISTRATION_OPEN:-true}
    RADAR_COOKIE_SECURE: ${RADAR_COOKIE_SECURE:-false}
    # Empty: resumes are read by the built-in parser. With the docling
    # profile set it to http://docparser:8000.
    RADAR_DOCPARSER_URL: ${RADAR_DOCPARSER_URL:-}
    # Short videos. Empty turns them off; with the video profile set it to
    # http://shorts:3000, and with the voice profile the voice to http://tts:8000.
    RADAR_SHORTS_URL: ${RADAR_SHORTS_URL:-}
    RADAR_TTS_URL: ${RADAR_TTS_URL:-}
    RADAR_TTS_VOICE: ${RADAR_TTS_VOICE:-}
    # One request to the voice: a few lines on a GPU take seconds, on a CPU
    # minutes, so a stand without a GPU raises it.
    RADAR_TTS_TIMEOUT_SECONDS: ${RADAR_TTS_TIMEOUT_SECONDS:-300}
    RADAR_MEDIA_DIR: /data/media
    # Publishing to Telegram channels. Bot tokens are stored encrypted with a
    # key derived from RADAR_SECRET_KEY; without it no bot can be added. With
    # the telegram-mock profile point the API at http://telegram-mock:8089 to
    # try everything without Telegram.
    RADAR_SECRET_KEY: ${RADAR_SECRET_KEY:-}
    RADAR_TELEGRAM_API_URL: ${RADAR_TELEGRAM_API_URL:-https://api.telegram.org}
    # Copies of article pictures: on the media volume, or in S3 (the s3
    # profile starts SeaweedFS; then set RADAR_IMAGE_STORE=s3).
    RADAR_IMAGE_STORE: ${RADAR_IMAGE_STORE:-local}
    RADAR_S3_ENDPOINT: ${RADAR_S3_ENDPOINT:-s3:8333}
    RADAR_S3_BUCKET: ${RADAR_S3_BUCKET:-radar-images}
    RADAR_S3_ACCESS_KEY: ${RADAR_S3_ACCESS_KEY:-radar}
    RADAR_S3_SECRET_KEY: ${RADAR_S3_SECRET_KEY:-change-me-s3-secret}
    RADAR_S3_SECURE: ${RADAR_S3_SECURE:-false}
    # Reader events for analytics and for training the feed ranker. Set it
    # to an empty value (RADAR_CLICKHOUSE_URL=) to turn events off.
    RADAR_CLICKHOUSE_URL: ${RADAR_CLICKHOUSE_URL-http://clickhouse:8123}
    RADAR_CLICKHOUSE_USER: radar
    RADAR_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-radar}
    RADAR_CLICKHOUSE_DATABASE: radar
    RADAR_RANKER_SHARE: ${RADAR_RANKER_SHARE:-0.5}
  depends_on: &backend-deps
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: radar
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Replicas open many short-lived connections; the bouncer multiplexes them
  # onto a small, fixed number of server connections.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: radar
      DB_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      DB_NAME: radar
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Database 0 is the task broker (streams, append-only file), database 1 the
  # cache. volatile-lru evicts only keys with a TTL, so queued tasks survive
  # memory pressure.
  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # What readers were shown and what they did with it: an append-only history
  # for analytics and for training the feed ranker. Articles, profiles and
  # current marks stay in PostgreSQL; see docs/DECISIONS.md.
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: radar
      CLICKHOUSE_USER: radar
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-radar}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    mem_limit: ${CLICKHOUSE_MEMORY:-1g}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/config.d/small.xml:/etc/clickhouse-server/config.d/small.xml:ro
      - ./clickhouse/users.d/small.xml:/etc/clickhouse-server/users.d/small.xml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Schema migrations, checkpoint tables and the default sources and profiles.
  # Talks to PostgreSQL directly: DDL does not belong behind a transaction pool.
  migrate:
    <<: *backend
    restart: "no"
    command: ["radar", "migrate", "--seed", "--sample", "/samples/articles.jsonl", "--ingest"]
    environment:
      <<: *backend-env
      RADAR_DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar}@postgres:5432/radar
      RADAR_DB_DISABLE_PREPARED_STATEMENTS: "false"
    volumes:
      # A snapshot of real publications, so the first digest can be built
      # before the first feed fetch finishes (or with no internet at all).
      - ./data/samples:/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "radar.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    deploy:
      replicas: ${API_REPLICAS:-2}
    # Serves finished videos, which only the media worker writes, and keeps
    # copies of the pictures of articles opened in the reader.
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Feed fetching and embedding: I/O-bound, cheap to scale.
  worker-ingest:
    <<: *backend
    command: ["taskiq", "worker", "radar.worker.brokers:ingest_broker", "radar.worker.tasks", "--ack-type", "when_executed", "--max-async-tasks", "16", "--workers", "1"]
    deploy:
      replicas: ${INGEST_WORKERS:-1}
    # Sends posts, and keeps a copy of a picture Telegram could not fetch.
    volumes:
      - media:/data/media
    networks:
      - default
      - solving

  # Digest building: bound by the model server, scaled separately so a burst
  # of digests cannot starve ingestion.
  worker-digest:
    <<: *backend
    command: ["taskiq", "worker", "radar.worker.brokers:digest_broker", "radar.worker.tasks", "--ack-type", "when_executed", "--max-async-tasks", "2", "--workers", "1"]
    deploy:
      replicas: ${DIGEST_WORKERS:-2}

  # Work a reader is waiting for at the screen: resume analysis during
  # sign-up and taste updates after a like. Its own queue, so neither feeds
  # nor digests can hold it up.
  worker-profile:
    <<: *backend
    command: ["taskiq", "worker", "radar.worker.brokers:profile_broker", "radar.worker.tasks", "--ack-type", "when_executed", "--max-async-tasks", "8", "--workers", "1"]
    deploy:
      replicas: ${PROFILE_WORKERS:-1}
    networks:
      - default
      - parsing

  # Short videos: writes the script, asks for the voice and the render, and
  # stores the MP4. One video at a time: the renderer takes every core it has.
  # Short videos, and spoken briefs of management digests, which need the
  # voice profile alone.
  worker-media:
    <<: *backend
    profiles: ["video", "voice"]
    command: ["taskiq", "worker", "radar.worker.brokers:media_broker", "radar.worker.tasks", "--ack-type", "when_executed", "--max-async-tasks", "1", "--workers", "1"]
    volumes:
      - media:/data/media
    networks:
      - default
      - rendering

  scheduler:
    <<: *backend
    command: ["taskiq", "scheduler", "radar.worker.brokers:scheduler", "radar.worker.tasks"]

  # Digests without a browser, written to ./out:
  #   docker compose run --rm cli digest --audience specialist
  # Root inside, so that it can write into ./out whoever owns it on the host;
  # the files are then handed to the folder's owner. Reaches the browser
  # step like the ingest worker does, for `digest --fresh`.
  cli:
    <<: *backend
    profiles: ["cli"]
    restart: "no"
    entrypoint: ["radar"]
    command: ["digest", "--help"]
    user: "0:0"
    cap_drop: []
    working_dir: /out
    environment:
      <<: *backend-env
      RADAR_LOG_LEVEL: ${RADAR_CLI_LOG_LEVEL:-WARNING}
      # File names carry the hour; the digests themselves say МСК.
      TZ: Europe/Moscow
    volumes:
      - ./out:/out
    networks:
      - default
      - solving

  # Caddy serves the built frontend and balances /api across api replicas.
  web:
    build:
      context: ./frontend
    image: radar-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Resume parsing with docling: page layout, OCR of scans, slides and
  # images. It receives untrusted files, so it holds no credentials, has
  # no route to the database and no route to the internet: the models are
  # baked into the image.
  docparser:
    profiles: ["docling"]
    build:
      context: ./docparser
    image: radar-docparser:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A hostile document may try to eat the host; these caps keep the damage
    # inside this container.
    mem_limit: ${DOCPARSER_MEMORY:-3g}
    cpus: ${DOCPARSER_CPUS:-4}
    pids_limit: 256
    environment:
      DOCPARSER_THREADS: ${DOCPARSER_THREADS:-4}
      DOCPARSER_OCR: ${DOCPARSER_OCR:-true}
    networks:
      - parsing
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Remotion render service: props and narration in, MP4 out. Chrome draws
  # the frames, so it gets its own memory cap and shared memory. No route to
  # the internet: fonts and the browser are baked into the image.
  shorts:
    profiles: ["video"]
    build:
      context: ./shorts
    image: radar-shorts:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=2g
    shm_size: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SHORTS_MEMORY:-4g}
    cpus: ${SHORTS_CPUS:-4}
    pids_limit: 512
    environment:
      # Browser tabs rendering frames in parallel. Empty is half of the cores
      # the container gets (cpus above); Remotion refuses more than all of them.
      RENDER_CONCURRENCY: ${SHORTS_CONCURRENCY:-}
    networks:
      - rendering
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Qwen3-TTS voice. Measured on an NVIDIA GPU (-f docker-compose.gpu.yml);
  # without one it falls back to the CPU, at a speed nobody has measured.
  # The model is baked into the image.
  tts:
    profiles: ["voice"]
    build:
      context: ./tts
    image: radar-tts:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A runaway generation stops at these caps instead of taking the host.
    mem_limit: ${TTS_MEMORY:-8g}
    cpus: ${TTS_CPUS:-4}
    pids_limit: 256
    environment:
      TTS_SPEAKER: ${TTS_SPEAKER:-}
      TTS_KEEP_ALIVE_SECONDS: ${TTS_KEEP_ALIVE_SECONDS:-600}
      TTS_CHECK_MODEL: ${TTS_CHECK_MODEL:-}
      # Whisper checks every line on the CPU, beside the voice on the GPU.
      TTS_CHECK_THREADS: ${TTS_CPUS:-4}
      # PyTorch 2.14 replaces some CUDA ops with Triton kernels compiled on
      # first use, which needs a C compiler and a writable cache that this
      # image does not have. The plain CUDA kernels are what was measured.
      TORCH_DISABLE_NATIVE_JIT: "1"
      # librosa compiles with numba and caches the result next to itself;
      # the image is read-only, so the caches go to /tmp.
      NUMBA_CACHE_DIR: /tmp/numba
      XDG_CACHE_HOME: /tmp/cache
      MPLCONFIGDIR: /tmp/matplotlib
    networks:
      - rendering
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # The embedding model is inside the image: a start without internet pulls
  # nothing, the language model comes in a volume or a directory of models.
  ollama:
    profiles: ["ollama"]
    build: &ollama-build
      context: ./ollama
      args:
        EMBEDDING_MODEL: ${RADAR_EMBEDDING_MODEL:-embeddinggemma:300m}
    image: radar-ollama:local
    restart: unless-stopped
    environment:
      # Parallel slots did not raise throughput on one GPU (76 vs 84 tokens/s
      # in total), they only multiply the context memory. See docs/DECISIONS.md.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: 30m
      # Ollama 0.35 asks ollama.com for cloud models and recommendations at
      # start; nothing here needs them. The cloud model for development is
      # asked by the backend directly, not through this Ollama.
      OLLAMA_NO_CLOUD: "1"
    volumes:
      # A volume by default. In a closed network: the directory the models
      # were unpacked to from the delivery archive (scripts/offline_bundle.sh).
      - ${OLLAMA_MODELS_DIR:-ollama}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    profiles: ["ollama"]
    build: *ollama-build
    image: radar-ollama:local
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Pulls only what Ollama lacks, so a start without internet passes once
      # the models are there. The language model is pulled only when it runs
      # in this Ollama, not in vLLM or elsewhere; the embedder alone needs no 22.6 GB.
      - >-
        set -e;
        have() { ollama show "$$1" >/dev/null 2>&1; };
        have ${RADAR_EMBEDDING_MODEL:-embeddinggemma:300m}
        || ollama pull ${RADAR_EMBEDDING_MODEL:-embeddinggemma:300m};
        if [ "${RADAR_LLM_PROVIDER:-heuristic}" = ollama ] && [ -z "${RADAR_LLM_BASE_URL:-}" ];
        then have ${RADAR_LLM_MODEL:-qwen3.6:35b-a3b}
        || ollama pull ${RADAR_LLM_MODEL:-qwen3.6:35b-a3b}; fi
    depends_on:
      ollama:
        condition: service_healthy

  # A stand-in for the Telegram Bot API with a viewer of what was sent:
  # http://localhost:8089. Any token of the right shape is a bot.
  telegram-mock:
    profiles: ["telegram-mock"]
    <<: *backend
    # The mock keeps everything in memory: no database, secrets or storage.
    environment:
      RADAR_ENVIRONMENT: production
      RADAR_LOG_LEVEL: ${RADAR_LOG_LEVEL:-INFO}
    depends_on: {}
    command: ["radar", "telegram-mock", "--host", "0.0.0.0", "--port", "8089"]
    ports:
      - "127.0.0.1:8089:8089"

  # The headless browser (browser/, ingest/browser.py): Camoufox, a Firefox
  # that hides the marks of automation, for pages drawn by script and JS
  # challenges that stop curl_cffi. It opens addresses from the sources, so
  # it sits on the solving network with the ingest worker only, and inside
  # it every connection goes through a proxy that reaches public addresses
  # only. With RADAR_BROWSER_URL empty it is not asked; then also leave it
  # out with `docker compose up --scale browser=0`.
  browser:
    build:
      context: ./browser
      additional_contexts:
        certs: ./backend/src/radar/ingest/certs
    image: radar-browser:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${BROWSER_MEMORY:-1g}
    pids_limit: 512
    shm_size: 256m
    environment:
      BROWSER_TABS: ${BROWSER_TABS:-2}
      BROWSER_TIMEOUT_SECONDS: ${BROWSER_TIMEOUT_SECONDS:-30}
      TZ: Europe/Moscow
    networks:
      - solving

  # FlareSolverr: Chrome that passes a JS challenge when the browser is
  # refused too (ingest/solver.py). It opens addresses from the sources, so it sits
  # on a network of its own with the ingest worker only: no route to the
  # database, the queues or the api. Set RADAR_FLARESOLVERR_URL to use it.
  flaresolverr:
    profiles: ["solver"]
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: Europe/Moscow
    security_opt:
      - no-new-privileges:true
    mem_limit: ${FLARESOLVERR_MEMORY:-1g}
    networks:
      - solving

  # S3-compatible storage for picture copies (RADAR_IMAGE_STORE=s3). SeaweedFS
  # in its single-container mode; MinIO no longer publishes images.
  s3:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${RADAR_S3_ACCESS_KEY:-radar}
      AWS_SECRET_ACCESS_KEY: ${RADAR_S3_SECRET_KEY:-change-me-s3-secret}
      S3_BUCKET: ${RADAR_S3_BUCKET:-radar-images}
    volumes:
      - s3data:/data

networks:
  # No gateway: containers on it reach each other and nothing else.
  parsing:
    internal: true
  # The media worker and the services that voice and render its videos.
  rendering:
    internal: true
  # The ingest worker, the browser and FlareSolverr. Not internal: the
  # browsers read sites.
  solving:

