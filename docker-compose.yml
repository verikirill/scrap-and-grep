name: radar

# One image, several roles. Everything that holds state is a separate service,
# so the api and the workers can be scaled with --scale without coordination.
x-backend: &backend
  build:
    context: ./backend
  image: radar-backend:local
  restart: unless-stopped
  # The backend needs no privileges and writes nothing but temporary files.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: &backend-env
    RADAR_ENVIRONMENT: production
    RADAR_LOG_LEVEL: ${RADAR_LOG_LEVEL:-INFO}
    RADAR_DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar}@pgbouncer:6432/radar
    RADAR_DB_DISABLE_PREPARED_STATEMENTS: "true"
    RADAR_BROKER_URL: redis://valkey:6379/0
    RADAR_CACHE_URL: redis://valkey:6379/1
    RADAR_OLLAMA_BASE_URL: ${RADAR_OLLAMA_BASE_URL:-http://ollama:11434}
    RADAR_EMBEDDING_PROVIDER: ${RADAR_EMBEDDING_PROVIDER:-hashing}
    RADAR_EMBEDDING_MODEL: ${RADAR_EMBEDDING_MODEL:-embeddinggemma:300m}
    RADAR_LLM_PROVIDER: ${RADAR_LLM_PROVIDER:-heuristic}
    RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-qwen3.5:9b}
    RADAR_LLM_CONCURRENCY: ${RADAR_LLM_CONCURRENCY:-2}
    RADAR_INGEST_CRON: ${RADAR_INGEST_CRON:-*/15 * * * *}
    RADAR_CANDIDATE_LIMIT: ${RADAR_CANDIDATE_LIMIT:-60}
    RADAR_RATE_LIMIT_PER_MINUTE: ${RADAR_RATE_LIMIT_PER_MINUTE:-120}
    RADAR_DIGEST_TASK_TIMEOUT_SECONDS: ${RADAR_DIGEST_TASK_TIMEOUT_SECONDS:-1200}
    # Accounts. The demo sign-in is on by default so that the stack can be
    # looked at without registering; turn it off outside a demonstration.
    RADAR_DEMO_LOGIN: ${RADAR_DEMO_LOGIN:-true}
    RADAR_REGISTRATION_OPEN: ${RADAR_REGISTRATION_OPEN:-true}
    RADAR_COOKIE_SECURE: ${RADAR_COOKIE_SECURE:-false}
    # Empty: resumes are read by the built-in parser. With the docling
    # profile set it to http://docparser:8000.
    RADAR_DOCPARSER_URL: ${RADAR_DOCPARSER_URL:-}
    # Short videos. Empty turns them off; with the video profile set it to
    # http://shorts:3000, and with the voice profile the voice to http://tts:8000.
    RADAR_SHORTS_URL: ${RADAR_SHORTS_URL:-}
    RADAR_TTS_URL: ${RADAR_TTS_URL:-}
    RADAR_TTS_VOICE: ${RADAR_TTS_VOICE:-}
    RADAR_MEDIA_DIR: /data/media
  depends_on: &backend-deps
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: radar
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Replicas open many short-lived connections; the bouncer multiplexes them
  # onto a small, fixed number of server connections.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: radar
      DB_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      DB_NAME: radar
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Database 0 is the task broker (streams, append-only file), database 1 the
  # cache. volatile-lru evicts only keys with a TTL, so queued tasks survive
  # memory pressure.
  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Schema migrations, checkpoint tables and the default sources and profiles.
  # Talks to PostgreSQL directly: DDL does not belong behind a transaction pool.
  migrate:
    <<: *backend
    restart: "no"
    command: ["radar", "migrate", "--seed", "--sample", "/samples/articles.jsonl", "--ingest"]
    environment:
      <<: *backend-env
      RADAR_DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar}@postgres:5432/radar
      RADAR_DB_DISABLE_PREPARED_STATEMENTS: "false"
    volumes:
      # A snapshot of real publications, so the first digest can be built
      # before the first feed fetch finishes (or with no internet at all).
      - ./data/samples:/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "radar.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    deploy:
      replicas: ${API_REPLICAS:-2}
    # Serves finished videos; only the media worker writes them.
    volumes:
      - media:/data/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Feed fetching and embedding: I/O-bound, cheap to scale.
  worker-ingest:
    <<: *backend
    command: ["taskiq", "worker", "radar.worker.brokers:ingest_broker", "radar.worker.tasks", "--ack-type", "when_executed", "--max-async-tasks", "16", "--workers", "1"]
    deploy:
      replicas: ${INGEST_WORKERS:-1}

  # Digest building: bound by the model server, scaled separately so a burst
  # of digests cannot starve ingestion.
  worker-digest:
    <<: *backend
    command: ["taskiq", "worker", "radar.worker.brokers:digest_broker", "radar.worker.tasks", "--ack-type", "when_executed", "--max-async-tasks", "2", "--workers", "1"]
    deploy:
      replicas: ${DIGEST_WORKERS:-2}

  # Work a reader is waiting for at the screen: resume analysis during
  # sign-up and taste updates after a like. Its own queue, so neither feeds
  # nor digests can hold it up.
  worker-profile:
    <<: *backend
    command: ["taskiq", "worker", "radar.worker.brokers:profile_broker", "radar.worker.tasks", "--ack-type", "when_executed", "--max-async-tasks", "8", "--workers", "1"]
    deploy:
      replicas: ${PROFILE_WORKERS:-1}
    networks:
      - default
      - parsing

  # Short videos: writes the script, asks for the voice and the render, and
  # stores the MP4. One video at a time: the renderer takes every core it has.
  worker-media:
    <<: *backend
    profiles: ["video"]
    command: ["taskiq", "worker", "radar.worker.brokers:media_broker", "radar.worker.tasks", "--ack-type", "when_executed", "--max-async-tasks", "1", "--workers", "1"]
    volumes:
      - media:/data/media
    networks:
      - default
      - rendering

  scheduler:
    <<: *backend
    command: ["taskiq", "scheduler", "radar.worker.brokers:scheduler", "radar.worker.tasks"]

  # Caddy serves the built frontend and balances /api across api replicas.
  web:
    build:
      context: ./frontend
    image: radar-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Resume parsing with docling: page layout, OCR of scans, slides and
  # images. It receives untrusted files, so it holds no credentials, has
  # no route to the database and no route to the internet: the models are
  # baked into the image.
  docparser:
    profiles: ["docling"]
    build:
      context: ./docparser
    image: radar-docparser:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A hostile document may try to eat the host; these caps keep the damage
    # inside this container.
    mem_limit: ${DOCPARSER_MEMORY:-3g}
    cpus: ${DOCPARSER_CPUS:-4}
    pids_limit: 256
    environment:
      DOCPARSER_THREADS: ${DOCPARSER_THREADS:-4}
      DOCPARSER_OCR: ${DOCPARSER_OCR:-true}
    networks:
      - parsing
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Remotion render service: props and narration in, MP4 out. Chrome draws
  # the frames, so it gets its own memory cap and shared memory. No route to
  # the internet: fonts and the browser are baked into the image.
  shorts:
    profiles: ["video"]
    build:
      context: ./shorts
    image: radar-shorts:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=2g
    shm_size: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SHORTS_MEMORY:-4g}
    cpus: ${SHORTS_CPUS:-4}
    pids_limit: 512
    environment:
      # Browser tabs rendering frames in parallel. Empty is half of the cores
      # the container gets (cpus above); Remotion refuses more than all of them.
      RENDER_CONCURRENCY: ${SHORTS_CONCURRENCY:-}
    networks:
      - rendering
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Qwen3-TTS voice. Runs on the CPU as is (slowly); on an NVIDIA GPU add
  # -f docker-compose.gpu.yml. The model is baked into the image.
  tts:
    profiles: ["voice"]
    build:
      context: ./tts
    image: radar-tts:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A runaway generation stops at these caps instead of taking the host.
    mem_limit: ${TTS_MEMORY:-8g}
    cpus: ${TTS_CPUS:-4}
    pids_limit: 256
    environment:
      TTS_SPEAKER: ${TTS_SPEAKER:-}
      TTS_KEEP_ALIVE_SECONDS: ${TTS_KEEP_ALIVE_SECONDS:-600}
      # librosa compiles with numba and caches the result next to itself;
      # the image is read-only, so the caches go to /tmp.
      NUMBA_CACHE_DIR: /tmp/numba
      XDG_CACHE_HOME: /tmp/cache
      MPLCONFIGDIR: /tmp/matplotlib
    networks:
      - rendering
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.35.0
    restart: unless-stopped
    environment:
      # Parallel slots did not raise throughput on one GPU (76 vs 84 tokens/s
      # in total), they only multiply the context memory. See docs/DECISIONS.md.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:0.35.0
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull ${RADAR_EMBEDDING_MODEL:-embeddinggemma:300m} && ollama pull ${RADAR_LLM_MODEL:-qwen3.5:9b}
    depends_on:
      ollama:
        condition: service_healthy

networks:
  # No gateway: containers on it reach each other and nothing else.
  parsing:
    internal: true
  # The media worker and the services that voice and render its videos.
  rendering:
    internal: true

volumes:
  pgdata:
  valkeydata:
  ollama:
  media:
